# The tables of this repository, declared as data: the authority on what data/ may hold, checked by
# tad (creation-guidelines/tad-engine) on every change. First generated on 2026-11-11 from the schema it replaced.
[[tables.about.fields]]
name = "title"
type = "string"
required = true

[[tables.about.fields]]
name = "summary"
type = "string"
required = true

[tables.backlog]
key = ["project", "id"]

[[tables.backlog.fields]]
name = "project"
type = "string"
required = true
enum = ["linux-phone-oco/docs", "linux-phone-oco/lab-tools", "linux-phone-oco/surya-lab", "linux-phone-oco/device-template", "linux-phone-oco/google-walleye-lab", "linux-phone-oco/sxmo-deviceprofiles"]

[[tables.backlog.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.backlog.fields]]
name = "title"
type = "string"
required = true

[[tables.backlog.fields]]
name = "status"
type = "string"
required = true
enum = ["open", "in-progress", "done"]

[[tables.backlog.fields]]
name = "note"
type = "string"

[[tables.backlog.fields]]
name = "opened"
type = "date"
required = true

[[tables.backlog.fields]]
name = "waits"
type = "string"
pattern = "^(?s).+$"

# what the item waits on that is another item of this base: ids, comma-separated. It is clear when each is done - read off the data. waits stays for what is outside (the author, hardware).
[[tables.backlog.fields]]
name = "blocked_by"
type = "string"
pattern = "^[a-z0-9]+(-[a-z0-9]+)*(, ?[a-z0-9]+(-[a-z0-9]+)*)*$"

# the shared resource the item cannot be done without: phone - its keeper takes it up, one change at a
# time, in that device's own base (tad q phone-queue there; docs serves no lane since 2026-11-17)
[[tables.backlog.fields]]
name = "needs"
type = "string"
enum = ["phone", "research", "build"]

# the device the item is for - its lane (devices.id): a phone item is taken only by that device's keeper, a
# research or build item by that lane's launcher, reading its own base (lane-next there). Required where needs
# is phone, by the records that set needs (tad has no conditional rule yet).
[[tables.backlog.fields]]
name = "device"
type = "string"

# the test whose pass proves the item done (a tests id, or the test still to write)
[[tables.backlog.fields]]
name = "proof"
type = "string"

# where it stands in its resource's queue, by the author's order (1 first; empty: after the ranked)
[[tables.backlog.fields]]
name = "rank"
type = "integer"

[[tables.backlog.fields]]
name = "about"
type = "string"

