# The phases of a bring-up, in the order one meets them: the guidebook's chapters. Held as rows, not as an enum
# of bringup_steps.stage, so the list can change (a stage added, split, renamed or moved) with
# `ikb bringup-stage`, never with a schema change; a step names its stage (a reference), and a stage a step
# still names cannot be removed.
[tables.bringup_stages]
key = ["id"]

[[tables.bringup_stages.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

# its place among the stages: the order of the chapters
[[tables.bringup_stages.fields]]
name = "ord"
type = "integer"
required = true
minimum = 1.0

[[tables.bringup_stages.fields]]
name = "title"
type = "string"
required = true

# what the stage is for, in a line or two: the chapter's opening
[[tables.bringup_stages.fields]]
name = "what"
type = "string"
required = true


# Bring-up steps (decision 2026-11-18-bringup-steps-generic-in-docs-status-in-each-base): every small step that
# makes Linux run on a machine, once for all machines, in the commons. A device never writes here: its own base
# claims each step (the steps table, contract steps = 1 in devicebase.toml) and docs pulls the claims into
# step_status, as it pulls parts into support_status. A step a base never claimed is not known yet.
[tables.bringup_steps]
key = ["id"]

[[tables.bringup_steps.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

# what the step is, in a few words
[[tables.bringup_steps.fields]]
name = "title"
type = "string"
required = true

# the phase it belongs to: a row of bringup_stages, which orders the guidebook's chapters
[[tables.bringup_steps.fields]]
name = "stage"
type = "string"
required = true

# its place within the stage when the edges leave two steps unordered (the guidebook's tie-break)
[[tables.bringup_steps.fields]]
name = "ord"
type = "integer"
required = true
minimum = 1.0

# which machines it holds for: any, or a class - boot:android (an Android bootloader), boot:uefi, usb:gadget,
# soc:qcom, power:battery ... A device whose class does not match records not-needed, with why.
[[tables.bringup_steps.fields]]
name = "applies"
type = "string"
required = true
pattern = "^(any|[a-z]+:[a-z0-9-]+)$"

# what done means, checkably: the sentence the proof tests
[[tables.bringup_steps.fields]]
name = "done_when"
type = "string"
required = true

# the generic proof: a tests id, or the check a device's own test must make (named, to write)
[[tables.bringup_steps.fields]]
name = "proof"
type = "string"
required = true

# how the proof is had: a host-side check on what the phone printed, the phone's own suite, a build check,
# a person's witness, or a research row (a reading that is not a test)
[[tables.bringup_steps.fields]]
name = "proof_kind"
type = "string"
required = true
enum = ["host-check", "phone-suite", "build-check", "witness", "research"]

# the lpoco command that does the step or most of it; none yet = the gap a helper fills
[[tables.bringup_steps.fields]]
name = "helper"
type = "string"

# the part of docs' catalogue whose first light this step is, when it is one
[[tables.bringup_steps.fields]]
name = "component"
type = "string"

# the guidebook's paragraph: how it is done, and the traps met so far with the records that met them
[[tables.bringup_steps.fields]]
name = "guide"
type = "string"
required = true

# the sources, comma-separated ids
[[tables.bringup_steps.fields]]
name = "sources"
type = "string"

[[tables.bringup_steps.fields]]
name = "checked_on"
type = "date"
required = true

# What a step needs before it. hard: it cannot be done before the other is done; soft: it can, but blind or
# at much greater cost (a crash window before the first kernel). Edges sharing a group are alternatives: one
# done is enough (a console over UART or over the USB gadget).
[tables.bringup_step_edges]
key = ["step", "requires"]

[[tables.bringup_step_edges.fields]]
name = "step"
type = "string"
required = true

[[tables.bringup_step_edges.fields]]
name = "requires"
type = "string"
required = true

[[tables.bringup_step_edges.fields]]
name = "kind"
type = "string"
required = true
enum = ["hard", "soft"]

[[tables.bringup_step_edges.fields]]
name = "group"
type = "string"

[[tables.bringup_step_edges.fields]]
name = "why"
type = "string"
required = true

# Each device's steps as its own base claims them: filled by the feed (feed-device-steps), never typed here.
# The feed gives every step x every device that has a base a row; what a base does not claim is unknown, "not known yet".
[tables.step_status]
key = ["device_id", "step_id"]

[[tables.step_status.fields]]
name = "device_id"
type = "string"
required = true

[[tables.step_status.fields]]
name = "step_id"
type = "string"
required = true

[[tables.step_status.fields]]
name = "status"
type = "string"
required = true
enum = ["done", "partial", "failing", "open", "not-needed", "unknown"]

# the test or check that proved it on this device (a tests id, or the base's own script)
[[tables.step_status.fields]]
name = "proof"
type = "string"

# where the proof ran: a test_runs id, a research row, a pull request
[[tables.step_status.fields]]
name = "run"
type = "string"

# what it was proven on: the image, kernel or dtb (its hash), so a later change can be told from it
[[tables.step_status.fields]]
name = "proven_on"
type = "string"

[[tables.step_status.fields]]
name = "notes"
type = "string"

[[tables.step_status.fields]]
name = "updated"
type = "date"
required = true

[[rules.references]]
field = "bringup_step_edges.step"
to = ["bringup_steps"]

[[rules.references]]
field = "bringup_step_edges.requires"
to = ["bringup_steps"]

[[rules.references]]
field = "bringup_steps.component"
to = ["components"]

[[rules.references]]
field = "step_status.device_id"
to = ["devices"]

[[rules.references]]
field = "step_status.step_id"
to = ["bringup_steps"]

[[rules.references]]
field = "bringup_steps.stage"
to = ["bringup_stages"]

# Chips (decision 2026-11-19-chip-knowledge-upstream-first-docs-keeps-the-index): one row per part number - a
# chip, a panel, a storage card, a PMIC block - about the part itself, never about one product: the same part in
# a phone, a tablet, a board or a car is one row, and the products are only where it was met (boards). The row
# holds what no open base holds and links up to the bases that hold the rest (homes): the driver and its binding
# live in mainline (or on its list, or a fork), the status of a SoC's blocks in linux-msm's mainline-status, the
# firmware in linux-firmware or on the product itself - never copied here. A chip is a subject: its research,
# decisions and backlog name it in about, and tad q about --subject ID reads it whole.
[tables.chips]
key = ["id"]

# maker-part, lower case: ti-tas2557, ti-drv2624, samsung-s6e3fa5, qcom-pm8998
[[tables.chips.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

# the part number as its maker writes it (TAS2557); a family's members are rows of their own
[[tables.chips.fields]]
name = "part"
type = "string"
required = true

[[tables.chips.fields]]
name = "maker"
type = "string"
required = true

# what it is, whatever product it sits in
[[tables.chips.fields]]
name = "kind"
type = "string"
required = true
enum = ["audio-amp", "audio-codec", "haptics", "display-panel", "touch", "storage", "pmic", "charger", "fuel-gauge", "sensor", "camera-sensor", "wireless", "modem", "nfc", "other"]

# the devicetree compatible(s) it is known by, comma-separated, each with where it stands when not in
# mainline (ti,tas2557 (on the list)); empty: no binding anywhere yet
[[tables.chips.fields]]
name = "compatible"
type = "string"

# how to tell the part is there, on any board: its bus, the addresses it can take, the id register and the
# value it reads back - what a generic presence check needs (the address one board uses goes in boards)
[[tables.chips.fields]]
name = "identify"
type = "string"

# the furthest home its driver has reached: mainline (in a released kernel), in-review (posted on the list),
# fork (carried in a fork that boots it), downstream (only in a vendor kernel), none (no driver anywhere)
[[tables.chips.fields]]
name = "driver_stage"
type = "string"
required = true
enum = ["mainline", "in-review", "fork", "downstream", "none"]

# where its knowledge lives upstream, one link per home: the mainline file or binding, the list thread with its
# version, a fork's commit, a status page, LKDDb - the row links to them and never copies them
[[tables.chips.fields]]
name = "homes"
type = "string"
required = true

# what it needs to run: the file's name, where it comes from, its licence and whether it may be shipped -
# never the file itself
[[tables.chips.fields]]
name = "firmware"
type = "string"

# what a second board must know, each with the record or link that met it
[[tables.chips.fields]]
name = "quirks"
type = "string"

# the boards known to carry it, any product: board (where it sits: bus, address; and the evidence: a dts, a
# vendor kernel, a list posting, a blob list - a claim until a board's test reads it back)
[[tables.chips.fields]]
name = "boards"
type = "string"

# the bring-up steps its bring-up covers: bringup_steps ids, comma-separated - its procedure is that chain
[[tables.chips.fields]]
name = "steps"
type = "string"

# the tests or checks that prove it works on a board: tests ids, or the check to write, named
[[tables.chips.fields]]
name = "proof"
type = "string"

# the tools and library steps that do its procedure: lpoco commands, lpoco-attended steps; none yet = the gap
[[tables.chips.fields]]
name = "tools"
type = "string"

# its datasheet or product page: a sources id
[[tables.chips.fields]]
name = "datasheet"
type = "string"

# the sources the row rests on, ids comma-separated
[[tables.chips.fields]]
name = "sources"
type = "string"

[[tables.chips.fields]]
name = "checked_on"
type = "date"
required = true

[[rules.references]]
field = "chips.datasheet"
to = ["sources"]
