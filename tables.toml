# Rules across tables (written by hand from the SQL checks they replaced; proven to give the same verdicts)
# The records of every place of linux-phone-oco, one database (decided 2026-11-17): each row names the
# place it is of in project; written through named records (records/), read on the face as of its place.
[tables.decisions]
key = ["project", "id"]

[[tables.decisions.fields]]
name = "id"
type = "string"
required = true

# the record in one line, at most 200 characters: what answers show (idealkb 0.4.0, briefs first)
[[tables.decisions.fields]]
name = "brief"
type = "string"

[[tables.decisions.fields]]
name = "project"
type = "string"
required = true
enum = ["linux-phone-oco/docs", "linux-phone-oco/lab-tools", "linux-phone-oco/surya-lab", "linux-phone-oco/device-template", "linux-phone-oco/google-walleye-lab", "linux-phone-oco/sxmo-deviceprofiles"]

[[tables.decisions.fields]]
name = "date"
type = "date"
required = true

[[tables.decisions.fields]]
name = "decision"
type = "string"
required = true

[[tables.decisions.fields]]
name = "why"
type = "string"
required = true

[[tables.decisions.fields]]
name = "rejected"
type = "string"

[[tables.decisions.fields]]
name = "about"
type = "string"

[[tables.decisions.fields]]
name = "research"
type = "string"

