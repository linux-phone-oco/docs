minimum = 0

[[tables.hardware.fields]]
name = "price"
type = "string"

[[tables.hardware.fields]]
name = "price_on"
type = "date"

[[tables.hardware.fields]]
name = "sources"
type = "string"

[[tables.hardware.fields]]
name = "file"
