[[tables.hardware.fields]]
name = "fit"
type = "string"
enum = ["claimed", "confirmed", "refuted"]

[[tables.hardware.fields]]
name = "fit_ref"
type = "string"

[[tables.hardware.fields]]
name = "spec"
type = "string"

[[tables.hardware.fields]]
name = "wiring"
type = "string"

[[tables.hardware.fields]]
name = "serves"
type = "string"

[[tables.hardware.fields]]
name = "about"
type = "string"

[[tables.hardware.fields]]
name = "general"
type = "string"

[[tables.hardware.fields]]
name = "qty"
