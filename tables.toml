# The upstream tables of grenudi/ideal-knowledge-base (idealkb 0.8): where knowledge can flow, and what is headed there.
# Where knowledge can flow: any external resource - a project, a mailing list, a tracker, a wiki, a standard, a
# person or team, another knowledge base's instance. One row each; what is headed there is an upstream_items row.
[tables.upstreams]
key = ["id"]

[[tables.upstreams.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.upstreams.fields]]
name = "kind"
type = "string"
required = true
enum = ["code-project", "list", "tracker", "wiki", "standard", "person-team", "kb-instance", "distro"]

[[tables.upstreams.fields]]
name = "name"
type = "string"
required = true

[[tables.upstreams.fields]]
name = "address"
type = "string"
required = true

[[tables.upstreams.fields]]
name = "how"
type = "string"
required = true

[[tables.upstreams.fields]]
name = "contacts"
type = "string"

[[tables.upstreams.fields]]
name = "notes"
type = "string"

# What was headed to an upstream: a patch, a piece of information, a correction, a question, a finding. It
# links back to the work here it comes from (from_work: a backlog item, decision or research id) and may be a
# row, a file in upstream/UPSTREAM/ID/ (file), or both. The state only moves forward; the person's word that
# a draft may go is a state (ready), never a flag an agent sets.
[tables.upstream_items]
key = ["id"]

[[tables.upstream_items.fields]]
name = "id"
type = "string"
required = true
pattern = "^[a-z0-9]+(-[a-z0-9]+)*$"

[[tables.upstream_items.fields]]
name = "upstream"
type = "string"
required = true

[[tables.upstream_items.fields]]
name = "title"
type = "string"
required = true

[[tables.upstream_items.fields]]
name = "form"
type = "string"
required = true
enum = ["patch", "information", "correction", "question", "finding"]

[[tables.upstream_items.fields]]
name = "state"
type = "string"
required = true
enum = ["draft", "ready", "sent", "under-review", "changes-requested", "accepted", "landed", "held", "rejected", "superseded", "not-needed", "withdrawn"]

[[tables.upstream_items.fields]]
name = "from_work"
type = "string"
required = true

[[tables.upstream_items.fields]]
name = "domain"
type = "string"

[[tables.upstream_items.fields]]
name = "tags"
type = "string"

[[tables.upstream_items.fields]]
name = "about"
type = "string"

[[tables.upstream_items.fields]]
name = "local_ref"
type = "string"

[[tables.upstream_items.fields]]
name = "file"
type = "string"

[[tables.upstream_items.fields]]
name = "sent_on"
type = "date"

[[tables.upstream_items.fields]]
name = "forwarded"
type = "string"

[[tables.upstream_items.fields]]
name = "bug"
type = "string"

[[tables.upstream_items.fields]]
name = "version"
type = "string"

[[tables.upstream_items.fields]]
name = "supersedes"
type = "string"

[[tables.upstream_items.fields]]
name = "applied_upstream"
type = "string"

[[tables.upstream_items.fields]]
name = "waits"
type = "string"

[[tables.upstream_items.fields]]
name = "note"
type = "string"

[[tables.upstream_items.fields]]
name = "last_update"
type = "date"
required = true

[[rules.references]]
field = "upstream_items.upstream"
to = ["upstreams"]

[[rules.references]]
field = "upstream_items.supersedes"
to = ["upstream_items"]

# The general hardware catalogue (the shape every device base uses, in tables.toml of device-template): what a thing is,
# its wiring and sources, status = general. A lab's stock and what is confirmed on a phone live in that phone's base.
[tables.hardware]
key = ["id"]
requires = [["price", "price_on"], ["fit_ref", "fit"]]

[[tables.hardware.fields]]
