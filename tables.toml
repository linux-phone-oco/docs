# What was headed to an upstream: a patch, a piece of information, a correction, a question, a finding. It
# links back to the work here it comes from (from_work: a backlog item, decision or research id) and may be a
# row, a file in upstream/UPSTREAM/ID/ (file), or both. The state only moves forward; the person's word that
# a draft may go is a state (ready), never a flag an agent sets.
[tables.upstream_items]
