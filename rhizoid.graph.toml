# rhizoid.graph.toml - linux-phone-oco's repository graph, the one place for the edges no pin file can say: which
# repositories follow which source, what a source tag looks like, how a pin is bumped and gated, and each fork's
# upstream (decision 2026-11-23-structure-git-flows-run-on-rhizoid). Read by `rhizoid status` and `rhizoid bump`
# (v0.2.4 or later): `rhizoid bump --graph rhizoid.graph.toml --root ~/Projects` lists what is behind. A gate is argv
# from this file, so a change here is reviewed like code. Started 2026-11-23 from git-rhizoid/rhizoid's
# examples/linux-phone-oco.graph.toml (514d7e7); kept here from now on.
# the revision each clone is read at
rev = "origin/main"

# how a bump lands: the rhizoid-bump timer on the lab host runs `bump now --land`, which lands each pin's pull
# request through the follower's own checks with ideal-agent's land; a failing gate or check leaves it open
[bump]
land = ["land"]

[clones]
"grenudi/lab-machine" = "lab-machine"
"grenudi/sxmo-utils" = "linux-phone-oco/sxmo-utils"
# the one kernel clone (moved 2026-11-23 from surya-audio/linux; decision 2026-11-23-structure-lab-machine-homes)
"grenudi/linux" = "linux-phone-oco/linux"

# idealkb -> the bases that follow it: each pins a release, keeps some files as its own, and keeps the source's marked
# part of tables.toml between idealkb:begin and idealkb:end
[[slice]]
source = "grenudi/ideal-knowledge-base"
pin = "idealkb.toml"
tag_prefix = "v"
marker = "idealkb"
moved_by = "idealkb-update-pins"
followers = [
  "linux-phone-oco/docs",
  "linux-phone-oco/device-template",
  "linux-phone-oco/surya-lab",
  "linux-phone-oco/google-walleye-lab",
]

# the device layer: docs gives it (device-layer/tables.toml, between device:begin and device:end) and reads its contract;
# each device base pins it by a release of docs, and carries the marked part as that release gave it
[[layer]]
pin = "devicebase.toml"
default_source = "linux-phone-oco/device-template"
owner = "linux-phone-oco/docs"
part = "device-layer/tables.toml"
marker = "device"
tag_prefix = "v"
followers = [
  "linux-phone-oco/surya-lab",
  "linux-phone-oco/google-walleye-lab",
  "linux-phone-oco/device-template",
]

# a tool pinned at a release of its source: a key of a TOML file, or a line of a script
[[tool]]
name = "lpoco"
source = "linux-phone-oco/lab-tools"
tag_prefix = "lpoco-v"
pin = "lab.toml"
key = "tools.lpoco"
moved_by = "lpoco-host-follow"
followers = ["grenudi/lab-machine"]

# rhizoid on the lab host: a release binary at its tag, [tools.rhizoid] in lab.toml (lab-tools #331)
[[tool]]
name = "rhizoid"
source = "git-rhizoid/rhizoid"
tag_prefix = "v"
pin = "lab.toml"
key = "tools.rhizoid.tag"
value = "v{version}"
followers = ["grenudi/lab-machine"]

[[tool]]
name = "tad"
moved_by = "tad-update-pins"
source = "creation-guidelines/tad-engine"
tag_prefix = "tad-v"
pin = "bin/install-tad.sh"
line = 'version="${TAD_VERSION:-{version}}"'
listed_in = { repo = "creation-guidelines/tad-engine", file = "consumers" }
followers = [
  "linux-phone-oco/docs",
  "linux-phone-oco/device-template",
  "linux-phone-oco/surya-lab",
  "linux-phone-oco/google-walleye-lab",
]


# lpoco-bringup as a lab's install script installs it (walleye's land-check runs it): a line of the script. Its
# lpoco-bringup reads the lab's device.toml, so a manifest table newer than the pin fails land-check (2026-11-26:
# 0.51.1 refused [connections] and held google-walleye-lab #1154)
[[tool]]
name = "lpoco-bringup"
source = "linux-phone-oco/lab-tools"
tag_prefix = "lpoco-bringup-v"
pin = "bin/install-bringup.sh"
line = 'version="${LPOCO_BRINGUP_VERSION:-{version}}"'
followers = ["linux-phone-oco/google-walleye-lab"]

# the kernel fork assembles its phones' test kernels from topics; it releases with torvalds/linux (decision
# 2026-11-23-structure-git-flows-run-on-rhizoid, MAP.md's kernel branches)
[[integration]]
repo = "grenudi/linux"
topics = ["topic/ITEM", "backport/ITEM/BASE"]
assembled = "int/NAME/LIST/BASE/N"
releases = "torvalds/linux"

# a fork: its tracking branch is its upstream's head (no branch: the remote's HEAD)
[[fork]]
fork = "grenudi/sxmo-utils"
branch = "master"
upstream = "https://git.sr.ht/~mil/sxmo-utils"
upstream_branch = "master"

[[fork]]
fork = "grenudi/linux"
tracks = "torvalds/linux"
patches = "integration"
added = "import"
upstream = "sm7150-mainline/linux"

# lpoco-attended as a Cargo git dependency of a lab's attended steps: the tag holds more than the version, a bump
# must build (cargo check, which also rewrites that crate's own Cargo.lock), and the lock goes in with the pin
[[tool]]
name = "lpoco-attended"
source = "linux-phone-oco/lab-tools"
tag_prefix = "lpoco-attended-v"
pin = "procedures/steps/Cargo.toml"
key = "dependencies.lpoco-attended.tag"
value = "lpoco-attended-v{version}"
gate = ["cargo", "check", "--manifest-path", "procedures/steps/Cargo.toml"]
also = ["procedures/steps/Cargo.lock"]
followers = ["linux-phone-oco/surya-lab"]

[[tool]]
name = "lpoco-attended"
source = "linux-phone-oco/lab-tools"
tag_prefix = "lpoco-attended-v"
pin = "procedures/steps/Cargo.toml"
key = "dependencies.lpoco-attended.tag"
value = "lpoco-attended-v{version}"
gate = ["cargo", "check", "--manifest-path", "procedures/steps/Cargo.toml"]
also = ["procedures/steps/Cargo.lock"]
followers = ["linux-phone-oco/google-walleye-lab"]

# lpoco-attended names lpoco-manifest by its released tag, not a path (lab-tools #342); manifest is tagged only when
# manifest/ changes (lab-tools #344), so a bump here is a real change
[[tool]]
name = "lpoco-manifest"
source = "linux-phone-oco/lab-tools"
tag_prefix = "lpoco-manifest-v"
pin = "attended/Cargo.toml"
key = "dependencies.lpoco-manifest.tag"
value = "lpoco-manifest-v{version}"
gate = ["cargo", "test", "--manifest-path", "attended/Cargo.toml"]
also = ["Cargo.lock"]
followers = ["linux-phone-oco/lab-tools"]

# every key of these tables is a pin some edge must cover, or is named here as unpinned with why (rhizoid status
# reports an uncovered key): lab.toml's tools, and each lab's attended steps crate's git dependencies
[[pins]]
follower = "grenudi/lab-machine"
file = "lab.toml"
table = "tools"
git_only = false
unpinned = { land = "a script pinned at a git rev (its rev is the pin), not a release", agent-env = "a script pinned at a git rev (its rev is the pin), not a release", nfpm = "its asset name holds the version, so tag and asset move together - one edge cannot move both yet", oco-work = "not known yet: no living repository to pin it to" }

[[pins]]
follower = "linux-phone-oco/google-walleye-lab"
file = "procedures/steps/Cargo.toml"
table = "dependencies"
git_only = true

[[pins]]
follower = "linux-phone-oco/surya-lab"
file = "procedures/steps/Cargo.toml"
table = "dependencies"
git_only = true
