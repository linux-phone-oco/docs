# This knowledge base follows grenudi/ideal-knowledge-base at the release named here: the generic named
# statements, and AGENTS.md's and tables.toml's part between idealkb:begin and idealkb:end. Its weekly pin
# job (idealkb's bin/update-pins.sh) moves it; own names the generic files this base keeps as its own.
# docs is one database of several places: its records take --project, its about query also reads the
# support matrix and the tests, and its standing tables carry project, needs and proof - so those are its own.
version = "0.27.0"
own = ["queries/about.sql", "records/decision.sql", "records/research.sql", "records/backlog.sql", "records/session-log.sql", "records/source.sql", "tables.toml"]
# Records kept for machines - feeds, derivations, a run filed, a filing from a script: ikb runs them like any
# other but leaves them out of ikb --help and ikb help.
machine = ["feed-kernel-activity", "feed-shell-releases", "feed-wiki-claims", "derive-support-status", "test-run", "support-unknown", "device-source", "milestone-readiness"]

# Why each own file is kept (bin/check-own.sh in ideal-knowledge-base reads it): a reason, or upstream:ITEM.
[why]
"queries/about.sql" = "docs' about also reads the support matrix and the tests"
"records/decision.sql" = "docs' records take --project"
"records/research.sql" = "docs' records take --project"
"records/backlog.sql" = "docs' records take --project, and name needs, device, proof and rank"
"records/session-log.sql" = "docs' records take --project"
"records/source.sql" = "docs' records take --project"
"tables.toml" = "docs' standing tables carry project, needs and proof, and docs holds the support, test and device tables"
