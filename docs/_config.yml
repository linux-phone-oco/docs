title: linux-phone-oco/docs
description: "Docs and logs for mainlining Linux on phones: which device supports which hardware, how we know, and why decisions were made."
theme: null
markdown: kramdown
plugins:
  - jekyll-optional-front-matter
  - jekyll-titles-from-headings
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: false
optional_front_matter:
  remove_originals: true
titles_from_headings:
  enabled: true
  strip_title: true
  collection: false
defaults:
  - scope:
      path: ""
    values:
      layout: default
