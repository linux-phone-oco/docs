# This repository's mark: how it fits the Open Commons Observatory's picture.
# https://github.com/open-commons-observatory/open-commons-observatory.github.io/tree/main/marks
schema = 1

# linux-phone-oco keeps one database, this one (decided 2026-11-17): the records of its other places are held
# here, each row naming its place in project, and stay theirs on the face.
holds = ["linux-phone-oco/lab-tools", "linux-phone-oco/surya-lab", "linux-phone-oco/device-template", "linux-phone-oco/sxmo-deviceprofiles", "linux-phone-oco/lens"]

[project]
id = "linux-phone-oco/docs"
name = "Linux Phones: phones running Linux, as good as Android - and how close we are"
title = "Linux Phones"
kind = "picture"
parent = "open-commons-observatory"

[exports]
wiki_claims = "data/wiki_claims.json"
backlog = "data/backlog.json"
decisions = "data/decisions.json"
research = "data/research.json"
sources = "data/sources.json"
problems = "data/problems.json"
concepts = "data/concepts.json"
manual_work = "data/manual_work.json"
manual_events = "data/manual_events.json"
landings = "data/landings.json"
session_log = "data/session_log.json"
test_runs = "data/test_runs.json"
support_status = "data/support_status.json"
feature_support = "data/feature_support.json"
landscape = "data/landscape.json"
features = "data/features.json"
platforms = "data/platforms.json"
components = "data/components.json"
devices = "data/devices.json"
milestones = "data/milestones.json"
translations = "data/translations.json"
idea = "data/idea.json"
workings = "data/workings.json"

# Other names its tables are known by: a name is not the place it names. The conditions milestones rest on
# are written feature:... and component:..., and these tables are features and components.
[also]
feature = "features"
component = "components"
