name: pages
# linux-phone's face, drawn from its open database alone. This place keeps every linux-phone record in tad,
# and the lens in face/; bin/face-data makes the engine's data from them, with each place's mark and what
# GitHub says the work made (commits, runs, releases) - no observatory in between (decision
# 2026-11-17-the-face-from-docs-own-data). The engine draws the face, and tad's page of every table stands
# beside it, under tables/. Nobody draws it by hand: a landing here (devlab files every phone's health
# reports here by itself) draws it again, and so does the clock, for what the family's other places land.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v5
      - name: tad, from its pinned release - the data checks out before anything is drawn
        run: |
          TAD_DEST="$RUNNER_TEMP/bin" ./bin/install-tad.sh
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/tad" check
      - name: the engine, at its main (kept between runs while its main stands still)
        id: engine
        run: echo "sha=$(git ls-remote https://github.com/open-commons-observatory/ocoeco-engine HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: ~/.cargo/bin/oco
          key: oco-${{ steps.engine.outputs.sha }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.cache.outputs.cache-hit != 'true'
        run: cargo install --locked --git https://github.com/open-commons-observatory/ocoeco-engine --rev ${{ steps.engine.outputs.sha }} oco
      - name: the face's data, from this place alone (its tables, the lens in face/, the marks, GitHub)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bin/face-data "$RUNNER_TEMP/data"
      - name: what has landed since, read off the commits - the record of work since glimpses ended
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./bin/landings.sh "$RUNNER_TEMP/data"
      - name: the face
        run: ~/.cargo/bin/oco site --data "$RUNNER_TEMP/data" --out _site
      - name: every table, as tad renders it
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site/tables
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
