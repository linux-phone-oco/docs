name: feeds
on:
  schedule:
    - cron: "17 5 * * 1"   # Mondays
  workflow_dispatch:
permissions:
  contents: write
jobs:
  feeds:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tad, from its pinned release
        run: TAD_DEST="$HOME/.local/bin" ./bin/install-tad.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run every feed (DuckDB's pinned binary reshapes the fetched data; tad checks it)
        run: make feeds
      - name: Render and verify
        run: make render verify
      - name: Commit the change to main, if there is one
        run: |
          git diff --quiet && { echo "nothing changed"; exit 0; }
          git config user.name "feeds"; git config user.email "feeds@linux-phone-oco"
          git commit -qam "chore(feed): data from the scheduled feeds"
          git push -q origin HEAD:main
